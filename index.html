<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="漫慢咖啡，慢一點，讓日常剛剛好。探索手沖咖啡、特調飲品、手作甜點與早午餐。">
  <title>漫慢咖啡・慢一點，剛剛好</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f1;
      --paper-deep: #f0ede5;
      --ink: #292b23;
      --muted: #89897e;
      --green: #304c3b;
      --green-light: #e7ece4;
      --orange: #bd6848;
      --line: #e9e5db;
      --serif: "Noto Serif TC", Georgia, serif;
      --sans: "DM Sans", "Noto Serif TC", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1192px, calc(100% - 64px)); margin: 0 auto; }

    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(41, 43, 35, .08);
    }
    .brand { display: inline-flex; align-items: center; }
    .brand img { display: block; height: 58px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 36px; color: #74756c; font-size: 13px; }
    .nav-links a:hover { color: var(--green); }
    .cart-button {
      height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      transition: background .2s, color .2s, border-color .2s;
    }
    .cart-button:hover, .cart-button[aria-expanded="true"] { border-color: var(--green); background: var(--green); color: white; }
    .cart-count {
      min-width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--green-light);
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
    }
    .cart-button:hover .cart-count, .cart-button[aria-expanded="true"] .cart-count { background: rgba(255,255,255,.2); color: white; }

    .hero {
      min-height: 444px;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 38px;
      padding: 50px 0 62px;
      background: linear-gradient(90deg, rgba(248,246,241,.9) 0%, rgba(248,246,241,.78) 44%, rgba(248,246,241,.24) 100%) center / cover no-repeat, url("coffee_order/1.jpg") center / cover no-repeat;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
    }
    .eyebrow::before { width: 21px; height: 1px; background: var(--orange); content: ""; }
    h1 {
      margin: 22px 0 15px;
      font-family: var(--serif);
      font-size: clamp(42px, 5.2vw, 66px);
      font-weight: 500;
      letter-spacing: .07em;
      line-height: 1.35;
    }
    h1 span { color: var(--green); }
    .hero-copy { max-width: 400px; margin: 0; color: #77786f; font-size: 14px; line-height: 2; }
    .hero-actions { display: flex; align-items: center; gap: 22px; margin-top: 29px; }
    .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 47px;
      padding: 0 20px;
      border-radius: 4px;
      background: var(--green);
      color: white;
      font-size: 12px;
      transition: background .2s, transform .2s;
    }
    .primary-link:hover { transform: translateY(-2px); background: #243a2d; }
    .open-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .open-dot { width: 7px; height: 7px; border-radius: 50%; background: #83a27a; box-shadow: 0 0 0 4px #83a27a20; }
    .menu-section { padding: 45px 0 90px; border-top: 1px solid rgba(41,43,35,.08); }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .section-kicker { color: var(--orange); font-size: 10px; font-weight: 600; letter-spacing: .2em; }
    h2 { margin: 8px 0 0; font-family: var(--serif); font-size: 31px; font-weight: 500; letter-spacing: .07em; }
    .section-note { margin: 0 0 4px; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 28px 0 26px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-chip {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: #77786f;
      cursor: pointer;
      font-size: 11px;
      transition: all .2s;
    }
    .filter-chip:hover { border-color: #9da99c; color: var(--green); }
    .filter-chip[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: white; }
    .search {
      width: 205px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: #929288;
    }
    .search:focus-within { border-color: #839080; }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 11px; }
    .search input::placeholder { color: #a4a399; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 18px; }
    .product-card {
      overflow: hidden;
      border: 1px solid #eeebe3;
      border-radius: 5px;
      background: #fffefa;
      transition: transform .22s, box-shadow .22s;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(45,49,39,.08); }
    .product-art {
      height: 174px;
      overflow: hidden;
    }
    .product-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }
    .product-art img.product-photo--lower-focus { object-position: center 60%; }
    .product-info { padding: 15px 15px 14px; }
    .product-category { color: var(--orange); font-size: 9px; letter-spacing: .1em; }
    .product-name { min-height: 26px; margin: 6px 0 2px; font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: .025em; }
    .product-en { overflow: hidden; color: #99998f; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .product-description { min-height: 38px; margin: 12px 0 14px; color: #787970; font-size: 10px; line-height: 1.8; }
    .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 11px; border-top: 1px solid #f0eee8; }
    .price { color: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 700; }
    .price small { margin-right: 2px; color: #929288; font-size: 9px; font-weight: 400; }
    .add-button {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid #dfe4dc;
      border-radius: 50%;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      transition: color .2s, background .2s, transform .2s;
    }
    .add-button:hover { transform: rotate(90deg); background: var(--green); color: white; }
    .empty-state, .load-error { grid-column: 1 / -1; padding: 48px 20px; color: var(--muted); text-align: center; font-size: 13px; }
    .load-error { color: #9d4933; }
    .footer { padding: 24px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 20px; }
    .footer-brand { color: var(--green); font-family: var(--serif); letter-spacing: .1em; }

    .cart-popover {
      position: fixed;
      z-index: 5;
      top: 70px;
      right: max(32px, calc((100vw - 1192px) / 2));
      width: min(360px, calc(100vw - 32px));
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fffefa;
      box-shadow: 0 18px 55px rgba(41,43,35,.15);
    }
    .cart-popover[hidden] { display: none; }
    .cart-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .cart-heading h3 { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 600; }
    .cart-heading-actions { display: flex; align-items: center; gap: 8px; }
    .cart-clear-button { padding: 6px 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 10px; }
    .cart-clear-button:hover:not(:disabled), .cart-remove-button:hover { color: #a74f39; }
    .cart-clear-button:disabled { cursor: not-allowed; opacity: .45; }
    .cart-close { width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; }
    .cart-items { max-height: 280px; overflow: auto; }
    .cart-empty { padding: 18px 0; color: var(--muted); font-size: 12px; text-align: center; }
    .cart-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid #f0eee8; }
    .cart-item-name { font-family: var(--serif); font-size: 12px; }
    .cart-item-price { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .quantity { display: flex; align-items: center; gap: 9px; }
    .quantity button { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; }
    .quantity span { min-width: 12px; text-align: center; font-size: 11px; }
    .cart-row-actions { display: flex; align-items: center; gap: 7px; }
    .cart-remove-button { width: 25px; height: 25px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1; }
    .cart-total { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; }
    .cart-checkout { width: 100%; min-height: 42px; border: 0; border-radius: 3px; background: var(--green); color: white; cursor: pointer; font-size: 12px; }
    .cart-checkout:disabled { background: #d3d4ca; cursor: not-allowed; }
    .toast {
      position: fixed;
      z-index: 7;
      right: 24px;
      bottom: 24px;
      padding: 12px 17px;
      border-radius: 4px;
      background: var(--green);
      color: white;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      .shell { width: min(100% - 40px, 720px); }
      .hero { min-height: 380px; gap: 20px; }
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .nav-links { gap: 20px; }
      .cart-popover { right: 20px; }
    }
    @media (max-width: 640px) {
      .shell { width: calc(100% - 36px); }
      .topbar { height: 68px; }
      .brand img { height: 48px; }
      .nav-links { display: none; }
      .cart-button { height: 38px; padding: 0 11px; }
      .hero { grid-template-columns: 1fr; gap: 27px; padding: 42px 0 46px; }
      h1 { margin-top: 15px; font-size: clamp(42px, 12vw, 58px); }
      .hero-copy { font-size: 13px; }
      .menu-section { padding: 35px 0 58px; }
      .section-heading { align-items: start; flex-direction: column; gap: 8px; }
      h2 { font-size: 26px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 13px; margin: 21px 0; }
      .filters { gap: 7px; }
      .filter-chip { padding: 8px 11px; font-size: 10px; }
      .search { width: 100%; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .product-art { height: 130px; }
      .product-info { padding: 12px 11px 11px; }
      .product-name { min-height: 40px; font-size: 13px; line-height: 1.55; }
      .product-description { min-height: 54px; margin: 9px 0 11px; font-size: 9px; }
      .price { font-size: 13px; }
      .add-button { width: 29px; height: 29px; }
      .footer-inner { flex-direction: column; gap: 6px; }
      .cart-popover { top: 61px; right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="#" aria-label="漫慢咖啡首頁">
      <img src="coffee_order/logo1.jpg" alt="">
    </a>
    <nav class="nav-links" aria-label="主要導覽">
      <a href="#story">關於漫慢</a>
      <a href="#menu">今日菜單</a>
    </nav>
    <button class="cart-button" id="cart-toggle" type="button" aria-expanded="false" aria-controls="cart-panel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 9H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1" fill="currentColor"/><circle cx="18" cy="20" r="1" fill="currentColor"/></svg>
      購物車 <span class="cart-count" id="cart-count" aria-live="polite">0</span>
    </button>
  </header>

  <main>
    <section class="shell hero" id="story">
      <div>
        <span class="eyebrow">A LITTLE PAUSE IN YOUR DAY</span>
        <h1>慢一點，<br><span>剛剛好。</span></h1>
        <p class="hero-copy">選一杯喜歡的咖啡，配一塊今天的甜點。把日常的步調放慢一點，留一段時間，好好享受此刻。</p>
        <div class="hero-actions">
          <a class="primary-link" href="#menu">探索今日菜單 <span aria-hidden="true">→</span></a>
          <span class="open-note"><span class="open-dot"></span>每日新鮮手作</span>
        </div>
      </div>
    </section>

    <section class="menu-section" id="menu">
      <div class="shell">
        <div class="section-heading">
          <div><span class="section-kicker">MADE WITH CARE, SERVED SLOW</span><h2>今天，想吃點什麼？</h2></div>
          <p class="section-note">從一杯咖啡開始，慢慢挑選你的美好日常。</p>
        </div>
        <div class="toolbar">
          <div class="filters" id="filters" role="group" aria-label="商品分類篩選"></div>
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input id="search-input" type="search" placeholder="搜尋喜歡的品項" aria-label="搜尋商品">
          </label>
        </div>
        <div class="product-grid" id="product-grid" aria-live="polite">
          <p class="empty-state">正在為你準備今日菜單⋯</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner"><span class="footer-brand">漫慢咖啡 · SLOW DOWN, SIP SLOW</span><span>找一個舒服的午後，讓咖啡陪你慢一點。</span></div>
  </footer>

  <aside class="cart-popover" id="cart-panel" aria-label="購物車" hidden>
    <div class="cart-heading">
      <h3>你的小小清單</h3>
      <div class="cart-heading-actions">
        <button class="cart-clear-button" id="cart-clear" type="button" disabled>清空購物車</button>
        <button class="cart-close" id="cart-close" type="button" aria-label="關閉購物車">×</button>
      </div>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-total"><span>合計</span><span id="cart-total">NT$ 0</span></div>
    <button class="cart-checkout" id="checkout-button" type="button" disabled>加入購物車後即可結帳</button>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const productGrid = document.getElementById("product-grid");
    const filters = document.getElementById("filters");
    const searchInput = document.getElementById("search-input");
    const lowerFocusProductNames = new Set(["法式經典巴斯克乳酪蛋糕", "小山園若竹抹茶磅蛋糕"]);
    const cart = new Map();
    const cartStorageKey = "manman-coffee-cart-v1";
    let products = [];
    let selectedCategory = "全部品項";
    let toastTimer;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function formatPrice(price) {
      return new Intl.NumberFormat("zh-TW").format(price);
    }

    function restoreCart() {
      try {
        const savedCart = localStorage.getItem(cartStorageKey);
        if (savedCart === null) return;

        const savedItems = JSON.parse(savedCart);
        if (!Array.isArray(savedItems)) throw new Error("購物車資料格式不正確");

        let invalidItemCount = 0;
        savedItems.forEach(item => {
          if (!item || !Number.isSafeInteger(item.productId) || !Number.isSafeInteger(item.quantity) || item.quantity < 1) {
            invalidItemCount += 1;
            return;
          }

          const product = products.find(candidate => candidate.id === item.productId);
          if (!product) {
            invalidItemCount += 1;
            return;
          }
          cart.set(product.id, { product, quantity: item.quantity });
        });

        if (invalidItemCount > 0) showToast("部分已儲存的商品資料無效，已略過無效項目");
      } catch (error) {
        console.error("讀取已儲存的購物車失敗：", error);
        showToast("無法讀取已儲存的購物車，請檢查瀏覽器儲存空間");
      }
    }

    function saveCart() {
      try {
        localStorage.setItem(cartStorageKey, JSON.stringify(
          [...cart.values()].map(({ product, quantity }) => ({ productId: product.id, quantity }))
        ));
      } catch (error) {
        console.error("儲存購物車失敗：", error);
        showToast("購物車未能保存，請檢查瀏覽器儲存空間");
      }
    }

    function renderFilters() {
      const categories = ["全部品項", ...new Set(products.map(product => product.category))];
      filters.innerHTML = categories.map(category => `
        <button class="filter-chip" type="button" data-category="${escapeHtml(category)}" aria-pressed="${category === selectedCategory}">
          ${escapeHtml(category)}
        </button>
      `).join("");
    }

    function renderProducts() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const visibleProducts = products.filter(product => {
        const matchesCategory = selectedCategory === "全部品項" || product.category === selectedCategory;
        const searchable = `${product.nameZh} ${product.nameEn} ${product.category} ${product.description}`.toLocaleLowerCase();
        return matchesCategory && searchable.includes(query);
      });

      if (visibleProducts.length === 0) {
        productGrid.innerHTML = '<p class="empty-state">沒有找到符合的品項，試試其他關鍵字吧。</p>';
        return;
      }

      productGrid.innerHTML = visibleProducts.map(product => {
        const imagePath = `coffee_order/${encodeURIComponent(product.nameZh)}.jpg`;
        const focusClass = lowerFocusProductNames.has(product.nameZh) ? " product-photo--lower-focus" : "";
        return `
          <article class="product-card">
            <div class="product-art">
              <img class="product-photo${focusClass}" src="${escapeHtml(imagePath)}" alt="${escapeHtml(product.nameZh)}" loading="lazy">
            </div>
            <div class="product-info">
              <div class="product-category">${escapeHtml(product.category)}</div>
              <h3 class="product-name">${escapeHtml(product.nameZh)}</h3>
              <div class="product-en" lang="en">${escapeHtml(product.nameEn)}</div>
              <p class="product-description">${escapeHtml(product.description)}</p>
              <div class="product-bottom">
                <span class="price"><small>NT$</small> ${formatPrice(product.priceNtd)}</span>
                <button class="add-button" type="button" data-add="${product.id}" aria-label="將${escapeHtml(product.nameZh)}加入購物車">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderCart() {
      const cartItems = document.getElementById("cart-items");
      const count = [...cart.values()].reduce((sum, item) => sum + item.quantity, 0);
      const total = [...cart.values()].reduce((sum, item) => sum + item.product.priceNtd * item.quantity, 0);
      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total").textContent = `NT$ ${formatPrice(total)}`;
      document.getElementById("cart-clear").disabled = count === 0;
      document.getElementById("checkout-button").disabled = count === 0;
      document.getElementById("checkout-button").textContent = count ? "確認品項（示範）" : "加入購物車後即可結帳";

      if (!count) {
        cartItems.innerHTML = '<p class="cart-empty">清單還空空的，挑一樣喜歡的吧。</p>';
        saveCart();
        return;
      }

      cartItems.innerHTML = [...cart.values()].map(({ product, quantity }) => `
        <div class="cart-row">
          <div><div class="cart-item-name">${escapeHtml(product.nameZh)}</div><div class="cart-item-price">NT$ ${formatPrice(product.priceNtd * quantity)}</div></div>
          <div class="cart-row-actions">
            <div class="quantity">
              <button type="button" data-quantity="${product.id}" data-change="-1" aria-label="減少${escapeHtml(product.nameZh)}數量">−</button>
              <span>${quantity}</span>
              <button type="button" data-quantity="${product.id}" data-change="1" aria-label="增加${escapeHtml(product.nameZh)}數量">+</button>
            </div>
            <button class="cart-remove-button" type="button" data-remove="${product.id}" aria-label="移除${escapeHtml(product.nameZh)}">×</button>
          </div>
        </div>
      `).join("");
      saveCart();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    filters.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      selectedCategory = button.dataset.category;
      renderFilters();
      renderProducts();
    });

    searchInput.addEventListener("input", renderProducts);

    productGrid.addEventListener("click", event => {
      const button = event.target.closest("[data-add]");
      if (!button) return;
      const product = products.find(item => item.id === Number(button.dataset.add));
      if (!product) return;
      const existing = cart.get(product.id);
      cart.set(product.id, { product, quantity: (existing?.quantity ?? 0) + 1 });
      renderCart();
      showToast(`已將「${product.nameZh}」加入清單`);
    });

    document.getElementById("cart-items").addEventListener("click", event => {
      const removeButton = event.target.closest("[data-remove]");
      if (removeButton) {
        const item = cart.get(Number(removeButton.dataset.remove));
        if (!item) return;
        cart.delete(item.product.id);
        renderCart();
        showToast(`已移除「${item.product.nameZh}」`);
        return;
      }

      const button = event.target.closest("[data-quantity]");
      if (!button) return;
      const id = Number(button.dataset.quantity);
      const item = cart.get(id);
      if (!item) return;
      const quantity = item.quantity + Number(button.dataset.change);
      if (quantity <= 0) cart.delete(id);
      else cart.set(id, { ...item, quantity });
      renderCart();
    });

    document.getElementById("cart-clear").addEventListener("click", () => {
      if (cart.size === 0) return;
      cart.clear();
      renderCart();
      showToast("購物車已清空");
    });

    const cartToggle = document.getElementById("cart-toggle");
    const cartPanel = document.getElementById("cart-panel");
    function setCartOpen(open) {
      cartPanel.hidden = !open;
      cartToggle.setAttribute("aria-expanded", String(open));
    }
    cartToggle.addEventListener("click", () => setCartOpen(cartPanel.hidden));
    document.getElementById("cart-close").addEventListener("click", () => setCartOpen(false));
    document.addEventListener("click", event => {
      if (!cartPanel.hidden && !cartPanel.contains(event.target) && !cartToggle.contains(event.target)) setCartOpen(false);
    });
    document.getElementById("checkout-button").addEventListener("click", () => {
      if (cart.size) showToast("這是商品展示頁，尚未串接線上結帳");
    });

    fetch("data/products.json")
      .then(response => {
        if (!response.ok) throw new Error(`商品資料載入失敗（HTTP ${response.status}）`);
        return response.json();
      })
      .then(data => {
        if (!Array.isArray(data) || data.some(item => !item || typeof item.id !== "number" || typeof item.category !== "string" || typeof item.nameZh !== "string" || typeof item.nameEn !== "string" || typeof item.description !== "string" || typeof item.priceNtd !== "number")) {
          throw new Error("商品資料格式不正確，請檢查 data/products.json");
        }
        products = data;
        restoreCart();
        renderFilters();
        renderProducts();
        renderCart();
      })
      .catch(error => {
        productGrid.innerHTML = `<p class="load-error">${escapeHtml(error.message)}。請透過本機網頁伺服器開啟此頁面。</p>`;
      });
  </script>
</body>
</html>
